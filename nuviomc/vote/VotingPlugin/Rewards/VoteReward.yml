# ============================================================
#  NuvioMC — פרס על הצבעה בודדת
#  יעד: plugins/VotingPlugin/Rewards/VoteReward.yml
#
#  זה הפרס שניתן בכל הצבעה, בכל אתר.
#  להתאמה: לשנות את הסכומים והפריטים לפי הכלכלה שלך.
# ============================================================

Messages:
  Player: '&b&lNuvio &8» &fתודה שהצבעת! &7קיבלת את הפרס שלך.'
  Title:
    Enabled: true
    Title: '&b&lתודה שהצבעת!'
    SubTitle: '&7ההצבעה נספרה'
    FadeIn: 10
    ShowTime: 40
    FadeOut: 10

# שידור לכל השרת. גורם לשחקנים אחרים לזכור שקיימת מערכת הצבעה,
# וזה למעשה הפרסום הפנימי הכי יעיל שיש.
BroadcastMessage: '&b&lNuvio &8» &f%player% &7הצביע לשרת! &8(&b/vote&8)'

# ---------- כסף ----------
# דורש Vault + פלאגין כלכלה מותקנים.
# אם אין לך כלכלה, תמחק את השורה הזו.
Money: 250

# ---------- ניסיון ----------
EXP: 25

# ---------- פריטים ----------
Items:
  VoteKey:
    Material: TRIPWIRE_HOOK
    Amount: 1
    Name: '&b&lמפתח הצבעה'
    Lore:
    - '&7תודה שתמכת ב-&bNuvioMC'
    - ''
    - '&8פותח את תיבת ההצבעות בספאון'

# ---------- פקודות ----------
# %player% מוחלף בשם השחקן.
# הפקודות רצות מהקונסולה, בלי סלאש בהתחלה.
Commands: []
# דוגמאות למה שאפשר לשים כאן:
# Commands:
# - 'crate key give %player% vote 1'
# - 'lp user %player% permission settemp essentials.fly true 1h'

# ---------- צליל ----------
Sound:
  Sound: ENTITY_PLAYER_LEVELUP
  Volume: 1
  Pitch: 1

# ============================================================
#  הערות
#
#  1. פרס חלש הורג את כל המערכת. הסכומים כאן הם נקודת פתיחה —
#     תכוון אותם לכלכלה שלך. כלל אצבע: הצבעה אחת צריכה להיות
#     שווה בערך 10–15 דקות משחק רגיל. פחות מזה ואף אחד לא יטרח.
#
#  2. אל תיתן ציוד קרבי כפרס הצבעה. זה הופך את השרת
#     ל-pay-to-win בלי שאף אחד בכלל שילם.
#
#  3. השדות כאן הם הנפוצים ב-VotingPlugin, אבל שמות המפתחות
#     יכולים להשתנות מעט בין גרסאות. אחרי ההעלאה תשווה
#     לקובץ הדוגמה ש-VotingPlugin יוצר לבד בתיקיית Rewards,
#     ותוודא שאין מפתח שהפלאגין לא מזהה. אם משהו לא ניתן,
#     הקונסולה תגיד לך בדיוק איזה מפתח בעייתי.
# ============================================================
